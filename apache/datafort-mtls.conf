# ═══════════════════════════════════════════════════════════════════
# Datafort — Apache mutual TLS configuration
#
# THIS FILE IS THE SECURITY BOUNDARY.
#
# Everything in api/device.php reads a verdict that Apache reaches here.
# If SSLVerifyClient is missing or set to `optional` and the PHP is left
# in `enforce`, the app will happily report "device verified" about a
# connection that presented nothing. The PHP cannot detect that on its
# own — from inside PHP, "no certificate was required" and "no
# certificate was sent" look identical.
#
# On cPanel this belongs in an Apache include, NOT in .htaccess:
#   WHM → Apache Configuration → Include Editor → Pre/Post VirtualHost Include
# or as a per-vhost include under:
#   /etc/apache2/conf.d/userdata/ssl/2_4/<user>/<domain>/datafort.conf
#   then: /scripts/ensure_vhost_includes --user=<user> && /scripts/restartsrv_httpd
#
# SSLVerifyClient CANNOT be set from .htaccess. If the host will not
# allow an Apache include, this cannot be done on that hosting — move to
# a VPS. See section 25 of the requirements.
# ═══════════════════════════════════════════════════════════════════

<VirtualHost *:443>

    ServerName  datafort.folksfirstlabs.com
    DocumentRoot /home/folksfi1/datafort.folksfirstlabs.com

    # ── Server TLS ──
    #
    # On cPanel these three lines are normally written by AutoSSL and
    # should NOT be edited by hand — cPanel rewrites the vhost on renewal
    # and your changes disappear. Add only the CLIENT-certificate block
    # below via an Include; leave the server certificate to cPanel.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/datafort.folksfirstlabs.com.crt
    SSLCertificateKeyFile   /etc/ssl/private/datafort.folksfirstlabs.com.key
    SSLCertificateChainFile /etc/ssl/certs/datafort-chain.crt

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off


    # ══ CLIENT CERTIFICATE VERIFICATION ═════════════════════════════
    #
    # The trust anchor. ONLY certificates signed by this CA are accepted.
    # This must be the private company CA (step-ca), never a public CA —
    # pointing it at a public bundle would accept a certificate from any
    # website on the internet.
    SSLCACertificateFile    /etc/ssl/datafort/company-ca.crt

    # Depth 2 allows CA → intermediate → laptop. Use 1 if the CA signs
    # laptop certificates directly, so an unexpected intermediate is
    # rejected rather than tolerated.
    SSLVerifyDepth          2

    # ── Rollout: change THIS line, in this order ──
    #
    #   Stage A   SSLVerifyClient none      certificates ignored entirely
    #   Stage B   SSLVerifyClient optional  browser is asked; missing is
    #                                       still allowed through. Run the
    #                                       app in device_enforcement='log'
    #                                       and watch device_auth_log.
    #   Stage C   SSLVerifyClient require   no certificate, no connection
    #
    # Do not jump A → C. In stage C a laptop whose enrolment silently
    # failed does not see a Datafort error page — it sees a browser TLS
    # failure, with no way to tell the user why. Sit in stage B until
    # device_auth_log shows zero denials for a full working week.
    SSLVerifyClient         optional

    # Without this, every SSL_CLIENT_* variable in api/device.php is
    # empty and device verification silently fails open in 'log' mode
    # and closed in 'enforce' mode. This is the single most commonly
    # missed line in an mTLS setup.
    SSLOptions              +StdEnvVars +ExportCertData


    # ── Revocation ──
    #
    # WITHOUT THIS, REVOKING A CERTIFICATE AT THE CA DOES NOTHING HERE.
    # Apache keeps accepting a revoked certificate until it expires. The
    # app-level revoke in devices-save.php still blocks the user, but the
    # stolen laptop can still complete the handshake and reach the login
    # page — the outer door stays unlocked.
    #
    # Publish the CRL from step-ca and refresh it on a schedule; a stale
    # CRL file makes Apache reject EVERYTHING, so the cron that updates
    # it needs monitoring.
    #
    # SSLCARevocationFile  /etc/ssl/datafort/company-ca.crl
    # SSLCARevocationCheck chain

    <Directory "/home/folksfi1/datafort.folksfirstlabs.com">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the config or the schema, whatever .htaccess says.
    <Files "config.php">
        Require all denied
    </Files>
    <DirectoryMatch "^/home/folksfi1/datafort.folksfirstlabs.com/api/migrations">
        Require all denied
    </DirectoryMatch>

    <IfModule mod_headers.c>
        # 2 years, preload-eligible. Only turn preload on when you are
        # sure the domain will never need plain HTTP again — it is
        # extremely hard to undo.
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    </IfModule>

    ErrorLog  /var/log/apache2/datafort-error.log
    CustomLog /var/log/apache2/datafort-access.log combined

    # Puts the certificate identity in the access log, so device
    # attribution survives even if the database is lost.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{SSL_CLIENT_S_DN_CN}x\" \"%{SSL_CLIENT_M_SERIAL}x\" \"%{SSL_CLIENT_VERIFY}x\"" datafort
    CustomLog /var/log/apache2/datafort-mtls.log datafort

</VirtualHost>


# ═══════════════════════════════════════════════════════════════════
# Port 80 — redirect only.
# ═══════════════════════════════════════════════════════════════════
<VirtualHost *:80>
    ServerName datafort.folksfirstlabs.com
    Redirect permanent / https://datafort.folksfirstlabs.com/
</VirtualHost>


# ═══════════════════════════════════════════════════════════════════
# ISSUING A LAPTOP CERTIFICATE WITH step-ca
# ═══════════════════════════════════════════════════════════════════
#
#   # One-time. OFFLINE — there is no CA server to run and no
#   # ca.<domain> hostname to create. See CERTIFICATES.md.
#   step certificate create "Movenetics Digital Device CA" \
#        company-ca.crt company-ca.key --profile root-ca --not-after 87600h
#
#   # Per laptop — CN must match company_devices.device_code exactly,
#   # because api/device.php cross-checks it:
#   step certificate create "LAPTOP-001" laptop-001.crt laptop-001.key \
#        --profile leaf --ca company-ca.crt --ca-key company-ca.key \
#        --not-after 8760h --no-password --insecure
#
#   # Package for Windows import:
#   openssl pkcs12 -export -out laptop-001.p12 \
#        -inkey laptop-001.key -in laptop-001.crt -certfile company-ca.crt
#
#   # Read the serial to paste into the Datafort device register:
#   openssl x509 -in laptop-001.crt -noout -serial
#   #   serial=8A91F23B     → register 8A91F23B
#
#   # Revoking (do this AS WELL AS revoking in Datafort):
#   openssl ca -config ca.cnf -revoke laptop-001.crt
#   openssl ca -config ca.cnf -gencrl -out company-ca.crl
#   # then copy company-ca.crl to SSLCARevocationFile below
#
#
# WINDOWS IMPORT — NON-EXPORTABLE PRIVATE KEY
#
#   certutil -user -importPFX -p "<password>" My laptop-001.p12 NoExport
#
# The NoExport flag is what stops the employee copying the certificate
# onto a personal machine. Without it, the whole device-binding argument
# collapses into "the file is on the company laptop, please leave it
# there". Where the hardware has a TPM, generate the key inside the TPM
# instead so it cannot be extracted even with administrator rights.
#
# Honest limit: a local administrator with the right tooling can still
# extract a software-protected key. TPM-backed keys resist that; NoExport
# alone only stops the casual copy.
