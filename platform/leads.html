<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads · Datafort Platform</title>
  <link rel="icon" href="../brand/favicon.ico" sizes="any">
  <link rel="icon" href="../brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css?v=5">
  <link rel="stylesheet" href="../app.css?v=6">
  <script src="../desktop-only.js?v=5"></script>
  <script src="../theme.js?v=5"></script>
</head>

<body>

<div class="shell">

  <aside class="side">
    <div class="side__brand">
      <img src="../brand/logo-mark-light.png" width="363" height="414" alt="" aria-hidden="true">
      <span class="word">DATAFORT</span>
    </div>
    <div class="side__label" style="margin-top:0">Platform</div>

    <a class="navlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Enterprises
    </a>
    <a class="navlink" href="pricing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Pricing
    </a>
    <a class="navlink" href="leads.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      Leads
      <span class="count" id="newCount" hidden></span>
    </a>
    <a class="navlink" href="admins.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.1a4 4 0 0 1 0 7.75"/></svg>
      Team
    </a>
    <a class="navlink" href="devices.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M2 20h20"/></svg>
      Devices
    </a>
    <a class="navlink" href="audit.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/></svg>
      Audit Log
    </a>

    <div class="side__foot">
      <button class="whoami" type="button">
        <span class="avatar" data-who="avatar">–</span>
        <span>
          <span class="whoami__name" data-who="name">–</span><br>
          <span class="whoami__role" data-who="role">–</span>
        </span>
      </button>
    </div>
  </aside>

  <div id="scrim" class="scrim" hidden></div>

  <div class="main">

    <div class="topbar">
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div>
        <h1>Leads</h1>
        <div class="topbar__sub">Submitted from pricing.html's "Talk to us" form</div>
      </div>
      <div class="topbar__spacer"></div>
      <select class="select" id="statusFilter" aria-label="Filter by status">
        <option value="">All</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="closed">Closed</option>
      </select>
      <button class="iconbtn" id="themeBtn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="content">

      <div class="card">
        <div class="card__body card__body--flush">
          <div class="tablewrap">
            <table class="table">
              <thead>
                <tr><th>When</th><th>Name</th><th>Email</th><th>Company</th><th>Plan</th><th>Message</th><th>Status</th><th class="shrink"></th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="empty" id="emptyState" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
            <h3>No leads yet</h3>
            <p>Inquiries from the pricing page's "Talk to us" form will show up here.</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="platform-api.js?v=1"></script>
<script src="platform-app.js?v=1"></script>
<script src="leads.js?v=1"></script>
</body>
</html>
