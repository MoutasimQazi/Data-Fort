<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead · Datafort</title>
  <link rel="icon" href="brand/favicon.ico" sizes="any">
  <link rel="icon" href="brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="app.css?v=5">
  <!-- Rep page: hardened. -->
  <link rel="stylesheet" href="guard.css?v=5">
  <!-- FIRST script on the page. Turns phones and tablets away before
       any markup renders — see desktop-only.js. -->
  <script src="desktop-only.js?v=5"></script>
  <script src="theme.js?v=5"></script>
</head>

<body data-requires="any">

<div class="shell">

  <aside class="side">
    <div class="side__brand">
      <img src="brand/logo-mark-light.png" width="363" height="414"
           alt="" aria-hidden="true">
      <span class="word">DATAFORT</span>
    </div>

    <a class="navlink" href="my-leads.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      My Leads
    </a>

    <div class="side__label">Today</div>
    <div style="padding: 4px 10px 8px;">
      <div class="quota" style="color: var(--on-dark-dim);">
        <div class="quota__row">
          <span>Reveals used</span>
          <span class="quota__count" id="quotaText" style="color:#fff">– / –</span>
        </div>
        <div class="meter" style="background: rgba(255,255,255,.14)">
          <div class="meter__fill" id="quotaFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="side__foot">
      <button class="whoami" type="button">
        <span class="avatar" data-who="avatar">–</span>
        <span>
          <span class="whoami__name" data-who="name">–</span><br>
          <span class="whoami__role" data-who="role">–</span>
        </span>
      </button>
    </div>
  </aside>

  <div id="scrim" class="scrim" hidden></div>


  <div class="main">

    <div class="topbar">
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <a class="iconbtn" href="my-leads.html" aria-label="Back to my leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div>
        <h1 id="leadName">–</h1>
        <div class="topbar__sub" id="leadSub">–</div>
      </div>
      <div class="topbar__spacer"></div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>


    <div class="content" id="content" style="grid-template-columns: minmax(0,1.4fr) minmax(0,1fr)">

      <!-- Left: the lead -->
      <div style="display:grid;gap:22px;align-content:start">

        <div class="card">
          <div class="card__head">
            <h2>Contact</h2>
            <div class="right"><span id="statusBadge"></span></div>
          </div>
          <div class="card__body">
            <dl id="details" style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:11px 20px;font-size:13.5px"></dl>
          </div>
        </div>

        <div class="card">
          <div class="card__head">
            <h2>Activity</h2>
            <div class="right">
              <button class="btn btn--ghost btn--sm" id="logCallBtn">Log a call</button>
            </div>
          </div>
          <div class="feed" id="activity"></div>
        </div>

      </div>

      <!-- Right: actions -->
      <div style="display:grid;gap:22px;align-content:start">

        <div class="card">
          <div class="card__head"><h2>Update status</h2></div>
          <div class="card__body" style="display:grid;gap:12px">
            <select class="select" id="statusSelect" style="width:100%">
              <option value="new">New — not yet contacted</option>
              <option value="working">Working — conversation open</option>
              <option value="won">Won — converted</option>
              <option value="lost">Lost — no longer pursuing</option>
            </select>
            <textarea class="input" id="noteBox" rows="3" placeholder="Add a note (optional)"></textarea>
            <button class="btn btn--primary btn--sm" id="saveStatus">Save</button>
          </div>
        </div>

        <!-- The relay. The rep composes here and Datafort sends; the
             address itself is never delivered to the browser, so there is
             nothing to copy into a personal mail client. -->
        <div class="card">
          <div class="card__head">
            <div>
              <h2>Send an email</h2>
              <div class="sub">Sent by Datafort on your behalf</div>
            </div>
          </div>
          <div class="card__body" style="display:grid;gap:12px">
            <div class="field">
              <label class="field__label">To</label>
              <div class="masked" id="emailTo" style="padding:9px 0">–</div>
              <span style="font-size:12px;color:var(--text-faint)">
                The address stays hidden. Datafort delivers the message.
              </span>
            </div>
            <input class="input" type="text" id="mailSubject" placeholder="Subject">
            <textarea class="input" id="mailBody" rows="5" placeholder="Write your message…"></textarea>
            <button class="btn btn--primary btn--sm" id="sendMail">Send through Datafort</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="api.js?v=5"></script>
<script src="app.js?v=5"></script>
<script src="watermark.js?v=5"></script>
<script src="guard.js?v=5"></script>
<script src="reveal.js?v=5"></script>
<script src="lead.js?v=5"></script>
</body>
</html>
